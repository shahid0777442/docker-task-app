<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Task Manager</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .info { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: inherit; font-size: 15px; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 15px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #334155; }
  li span { flex: 1; cursor: pointer; }
  li.done span { text-decoration: line-through; color: #64748b; }
  li button { background: #dc2626; padding: 4px 10px; font-size: 13px; }
  .empty { color: #64748b; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Docker Task Manager</h1>
  <div class="info" id="info">Loading...</div>
  <form id="form">
    <input type="text" id="title" placeholder="Naya task likhein..." autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
</div>

<script>
const list = document.getElementById('list');
const form = document.getElementById('form');
const titleInput = document.getElementById('title');

async function loadInfo() {
  const r = await fetch('/health');
  const d = await r.json();
  document.getElementById('info').textContent =
    `Container ID: ${d.hostname} | Mode: ${d.env} | Status: ${d.status}`;
}

async function loadTasks() {
  const tasks = await (await fetch('/api/tasks')).json();
  list.innerHTML = '';
  if (!tasks.length) {
    list.innerHTML = '<div class="empty">Koi task nahi hai</div>';
    return;
  }
  tasks.forEach(t => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const span = document.createElement('span');
    span.textContent = t.title;
    span.onclick = async () => { await fetch('/api/tasks/' + t._id, { method: 'PATCH' }); loadTasks(); };
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.onclick = async () => { await fetch('/api/tasks/' + t._id, { method: 'DELETE' }); loadTasks(); };
    li.append(span, del);
    list.appendChild(li);
  });
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const title = titleInput.value.trim();
  if (!title) return;
  await fetch('/api/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title })
  });
  titleInput.value = '';
  loadTasks();
});

loadInfo();
loadTasks();
</script>
</body>
</html>

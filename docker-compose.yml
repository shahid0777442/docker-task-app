services:
  app:
    build: .
    container_name: task-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017/taskdb
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - app-net

  mongo:
    image: mongo:7
    container_name: task-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - app-net

volumes:
  mongo-data:

networks:
  app-net:
